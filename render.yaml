services:
  - type: web
    name: dapp-backend
    env: node
    rootDir: apps/backend
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dapp-postgres
          property: connectionString

  - type: web
    name: dapp-web
    env: node
    rootDir: apps/web
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://dapp-backend.onrender.com
      - key: NEXT_PUBLIC_PAPER_TRADING_USDC_ADDRESS
        value: "0xa8ca857605523931e3b39cC947080C403F4B4FB8"

databases:
  - name: dapp-postgres
    databaseName: dapp_db
    user: dapp_user